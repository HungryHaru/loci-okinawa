<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沖縄 記憶の宮殿</title>
<meta name="theme-color" content="#1f3b6e">
<script>
  // 画面の色（自動／ライト／ダーク）。描画前に当てて、ちらつきを防ぐ
  try { const t = localStorage.getItem('loci-okinawa-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="記憶の宮殿">
<link rel="manifest" href="manifest.json?v=3">
<link rel="icon" href="icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Antique+Soft&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<!-- 初回：APIキー入力 -->
<div id="setup" class="overlay hidden">
  <div class="card">
    <h1>沖縄 記憶の宮殿</h1>
    <p id="setupMsg" class="hint"></p>
    <input id="apiKeyInput" type="password" placeholder="AIza..." autocomplete="off">
    <div class="row-btns">
      <button id="saveKeyBtn" class="primary">保存して開始</button>
      <button id="closeSetupBtn" class="ghost hidden">閉じる</button>
    </div>
  </div>
</div>

<div id="app">
  <div id="stage">
    <div id="pano"></div>
    <canvas id="ink"></canvas>
    <input id="imgFile" type="file" accept="image/*" class="hidden">
    <div id="inkBar">
      <button data-tool="move" class="active" title="視点を動かす">✋</button>
      <button data-tool="pen" title="ペンで落書き">✏️</button>
      <button data-tool="note" title="付箋を貼る（クリックした所に）">📝</button>
      <button data-tool="image" title="画像を貼る（AIで作った絵など。Ctrl+V や ドラッグ&ドロップでもOK）">🖼</button>
      <button data-tool="adjust" title="貼った画像の大きさ・位置を変える（角をドラッグで大きさ、中をドラッグで移動、ホイールでも大きさ、Delete で削除）">⤡</button>
      <span class="sep"></span>
      <button class="swatch active" data-color="#ff3b30" style="--c:#ff3b30" title="赤"></button>
      <button class="swatch" data-color="#ffcc00" style="--c:#ffcc00" title="黄"></button>
      <button class="swatch" data-color="#34c759" style="--c:#34c759" title="緑"></button>
      <button class="swatch" data-color="#0a84ff" style="--c:#0a84ff" title="青"></button>
      <button class="swatch" data-color="#ffffff" style="--c:#ffffff" title="白"></button>
      <span class="sep"></span>
      <button data-ink="width" title="ペンの太さ">●</button>
      <button data-ink="undo" title="1つ戻す">↶</button>
      <button data-ink="clear" title="この場所の落書きを全部消す">🗑</button>
    </div>
    <form id="searchBox" autocomplete="off">
      <input id="searchInput" type="search" placeholder="場所を検索（例：首里城、美ら海水族館）" enterkeyhint="search">
      <ul id="searchResults" class="hidden"></ul>
    </form>
    <div id="mapWrap">
      <button id="mapToggle" title="地図の大きさを切り替え">拡大</button>
      <div id="map"></div>
    </div>
  </div>

  <aside id="panel">
    <header>
      <div class="brand">
        <span class="brand-logo" aria-hidden="true"></span>
        <div class="brand-name">記憶の宮殿<small>OKINAWA LOCI</small></div>
        <div class="hdr-btns">
          <button id="newPalaceBtn" title="新しい宮殿を作る">＋</button>
          <button id="vaultBtn" title="Obsidian と連携する（Vault フォルダを選ぶ）">🔗</button>
          <a id="helpBtn" class="btn" href="help.html" target="_blank" title="使い方">？</a>
          <button id="menuBtn" title="メニュー">⋯</button>
        </div>
      </div>
      <select id="palaceSelect" title="宮殿（ルート）を選ぶ"></select>
      <div id="menu" class="hidden">
        <button data-menu="theme" id="themeMenuBtn">画面の色：自動</button>
        <div class="menu-sep"></div>
        <button data-menu="rename">宮殿の名前を変更</button>
        <button data-menu="delete">この宮殿を削除</button>
        <button data-menu="export">バックアップを保存（JSON）</button>
        <button data-menu="import">バックアップを読み込む</button>
        <button data-menu="storage">保存状況を見る</button>
        <button data-menu="vault-off">Obsidian 連携を解除</button>
        <button data-menu="notify">クラウド連携の設定（同期・LINE 通知）</button>
        <button data-menu="restore">クラウドのバックアップから戻す</button>
        <button data-menu="key">APIキーを変更</button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" class="hidden">
    </header>
    <div class="minsa" aria-hidden="true"></div>
    <nav class="tabs">
      <button data-mode="build" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg>作成</button>
      <button data-mode="review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 0 1 13-5.1M19.5 12a7.5 7.5 0 0 1-13 5.1"/><path d="M17.8 3.5v3.7h-3.7M6.2 20.5v-3.7h3.7"/></svg>復習</button>
      <button data-mode="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="17.5" r="1.2"/></svg>一覧</button>
      <button data-mode="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>記録</button>
    </nav>
    <section id="content"></section>
  </aside>
</div>

<div id="toast"></div>
<script src="app.js?v=4"></script>
</body>
</html>
